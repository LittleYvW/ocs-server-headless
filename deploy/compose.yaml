name: ocs-server-headless

services:
  ocs:
    image: ${OCS_IMAGE:-ocs-server-headless:local}
    build:
      context: ..
      dockerfile: Dockerfile
    # The application image comes from this checkout, not a registry.
    pull_policy: build
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      zerror:
        condition: service_healthy
    shm_size: 1gb
    cap_drop:
      - ALL
    # Chromium's sandbox chroots inside its own user namespace.
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-chromium.json
    environment:
      OCS_HOST: 0.0.0.0
      OCS_PORT: '15319'
      OCS_DATA_DIR: /data
      OCS_MAX_BROWSERS: ${OCS_MAX_BROWSERS:-4}
      OCS_MIN_FREE_MEMORY_MB: ${OCS_MIN_FREE_MEMORY_MB:-0}
      OCS_MAX_CPU_PERCENT: ${OCS_MAX_CPU_PERCENT:-0}
      OCS_OCR_URL: ${OCS_OCR_URL:-}
      OCS_SCRIPT_MANAGER_URL: ${OCS_SCRIPT_MANAGER_URL:-}
      OCS_EXTENSIONS: '${OCS_EXTENSIONS:-[]}'
      OCS_ALLOWED_ORIGINS: ${OCS_ALLOWED_ORIGINS:-}
      OCS_QUESTION_BANK_URL: http://zerror:3002
      OCS_QUESTION_BANK_TOKEN_FILE: /run/zerror/admin.token
    ports:
      - '${OCS_BIND_ADDRESS:-127.0.0.1}:${OCS_PORT:-15319}:15319'
    volumes:
      - ocs-data:/data
      - zerror-credentials:/run/zerror:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  zerror:
    image: ${ZERROR_IMAGE:-ocs-zerror-headless:local}
    build:
      context: ..
      dockerfile: services/zerror/Dockerfile
    pull_policy: build
    init: true
    restart: unless-stopped
    stop_grace_period: 65s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ZERROR_HOST: 0.0.0.0
      ZERROR_PORT: '3002'
      ZERROR_DATA_DIR: /data
      ZERROR_ADMIN_TOKEN_FILE: /credentials/admin.token
      ZERROR_MAX_CONCURRENT: ${ZERROR_MAX_CONCURRENT:-8}
    volumes:
      - zerror-data:/data
      - zerror-credentials:/credentials
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  ocs-data:
  zerror-data:
  zerror-credentials:
