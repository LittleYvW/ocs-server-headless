name: 🐞 Bug 报告
description: 报告无头服务、控制台或部署问题
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请填写以下信息以帮助我们快速定位问题。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 前置检查
      description: 在提交前请确认以下事项
      options:
        - label: 我已搜索过现有 issues，没有找到类似问题
          required: true
        - label: 我已尝试过最新版本
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 服务器操作系统
      description: 请选择实际运行服务的 Linux 系统
      options:
        - Linux (Docker / Compose)
        - Linux (Ubuntu/Debian)
        - Linux (openEuler)
        - Linux (WSL)
        - Linux (其他发行版)
      default: 0
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 源码版本
      description: 填写 git rev-parse HEAD 的结果，或源码包来源和日期
      placeholder: "Git commit SHA / 源码包日期"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述这个 bug
      placeholder: "发生了什么？你看到了什么异常行为？"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现此问题
      placeholder: |
        1. 执行部署命令或启动服务
        2. 打开控制台或请求 API
        3. 执行 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
      placeholder: "正常情况下应该..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 附上部署方式、服务与浏览器版本，以及已删除令牌和账号密码的日志
      render: shell
