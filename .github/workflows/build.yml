name: Build Headless Service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Build web console
        run: pnpm build:web
      - name: Run tests
        run: pnpm test
      - name: Upload service build
        uses: actions/upload-artifact@v7
        with:
          name: ocs-server-headless
          if-no-files-found: error
          retention-days: 14
          path: |
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            packages/common/package.json
            packages/common/lib/**
            packages/server/package.json
            packages/server/dist/**
            packages/server/web/**
            README.md
            docs/**
            deploy/**

  container:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build a versioned runtime image
        run: docker build --pull --tag ocs-server-headless:${{ github.sha }} .
      - name: Verify the actual image and persistent volume
        run: bash scripts/test-container.sh ocs-server-headless:${{ github.sha }}
      - name: Export the offline deployment bundle
        run: bash scripts/package-container.sh ocs-server-headless:${{ github.sha }}
      - name: Upload container deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: ocs-server-container
          if-no-files-found: error
          retention-days: 14
          path: releases/ocs-server-linux-*.tar.gz
